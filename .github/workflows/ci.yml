name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant_proto_phase01
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: PYTHONPATH=python/src pytest python/tests --tb=short -q

  ocaml-and-verification:
    # The real public verification surface: complete dune test (unit and
    # property suites, the frontend compile-pass/reject harness, the
    # 34-row Source counterpart coverage harness, datatype invariants,
    # compiled documentation examples) followed by the complete
    # demo/golden battery via artifact/reproduce.sh.  The Python backend
    # is installed FIRST because the OCaml bridge tests invoke it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (backend used by OCaml tests)
        run: pip install -r quant_proto_phase01/requirements.txt

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"

      - name: Install OCaml dependencies
        run: opam install dune ppxlib --yes

      - name: Build
        run: cd quant_proto_phase01/ocaml && opam exec -- dune build

      - name: Complete OCaml test suite
        run: cd quant_proto_phase01/ocaml && opam exec -- dune runtest --force

      - name: Full demo/golden battery and Python regression
        run: cd quant_proto_phase01 && opam exec -- ./artifact/reproduce.sh
