name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant_proto_phase01
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install numpy pytket pytket-pyzx pytest

      - name: Run Python tests
        run: PYTHONPATH=python/src pytest python/tests --tb=short -q

  ocaml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install numpy pytket pytket-pyzx

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"

      - name: Install OCaml dependencies
        run: opam install dune yojson --yes

      - name: Build OCaml surface language
        run: cd quant_proto_phase01/ocaml && opam exec -- dune build

      - name: Run OCaml unit tests
        run: cd quant_proto_phase01/ocaml && opam exec -- dune test

      - name: Run newtests suite
        run: cd quant_proto_phase01/ocaml && opam exec -- dune exec test/test_newtests.exe

      - name: Run E2E demos (OCaml → Python bridge)
        run: |
          cd quant_proto_phase01/ocaml
          opam exec -- dune exec demos/algorithms_e2e.exe
          opam exec -- dune exec demos/abstract_qswitch_e2e.exe
          opam exec -- dune exec demos/qswitch_instantiated_e2e.exe
          opam exec -- dune exec demos/short_circuit_e2e.exe
          opam exec -- dune exec demos/zn_controlled_phase_e2e.exe
